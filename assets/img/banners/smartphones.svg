<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Promoção de smartphones">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="55%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6f1e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="50%" stop-color="#6d6d6d"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <g opacity="0.28" stroke="#d4af37" stroke-width="1" fill="none">
    <circle cx="980" cy="200" r="150"/>
    <circle cx="980" cy="200" r="190"/>
    <circle cx="980" cy="200" r="230"/>
  </g>

  <g transform="translate(360 40)">
    <g transform="rotate(-12 120 160)">
      <rect x="40" y="20" width="150" height="300" rx="26" fill="url(#metal)"/>
      <rect x="50" y="30" width="130" height="280" rx="20" fill="#0d0d0d"/>
      <rect x="80" y="24" width="70" height="9" rx="4.5" fill="#2a2a2a"/>
    </g>
    <g transform="rotate(3 250 160)">
      <rect x="200" y="5" width="165" height="330" rx="28" fill="url(#metal)"/>
      <rect x="211" y="16" width="143" height="308" rx="22" fill="#101010"/>
      <rect x="211" y="16" width="143" height="308" rx="22" fill="url(#screen)" opacity="0.30"/>
      <rect x="266" y="10" width="80" height="10" rx="5" fill="#2a2a2a"/>
      <circle cx="282.5" cy="168" r="30" fill="none" stroke="#d4af37" stroke-width="3" opacity="0.7"/>
      <circle cx="282.5" cy="168" r="14" fill="#d4af37" opacity="0.5"/>
    </g>
    <g transform="rotate(18 480 160)" opacity="0.85">
      <rect x="420" y="45" width="140" height="280" rx="24" fill="url(#metal)"/>
      <rect x="429" y="54" width="122" height="262" rx="18" fill="#0d0d0d"/>
    </g>
  </g>
</svg>
