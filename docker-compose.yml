services:
  app:
    build: .
    container_name: royaltech
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_NAME=e5_royaltech
      - DB_USER=root
      - DB_PASS=
    # volumes:
    #   - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: royaltech_db
    restart: always
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=e5_royaltech
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"

    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
