# .github/release.yml
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 'Funcionalidades'
      labels:
        - feature
        - enhancement
    - title: 'Correções'
      labels:
        - bug
        - fix
    - title: 'Alterações técnicas'
      labels:
        - chore
        - refactor
    - title: 'Outras Mudanças'
      labels:
        - '*'
