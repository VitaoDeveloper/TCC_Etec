name: PHP Syntax Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    name: Verificar sintaxe PHP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Rodar php -l em todos os arquivos .php
        run: |
          find . -type f -name "*.php" ! -path "./vendor/*" -print0 \
            | xargs -0 -n1 -P4 php -l
